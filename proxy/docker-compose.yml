services:
  dc-tv-proxy:
    build: .
    container_name: dc-tv-proxy
    restart: unless-stopped
    ports:
      - "8765:8765"
    env_file: [.env, tune.env]   # .env = TOKEN + ADMIN_PASSWORD (secrets), tune.env = video/audio profile
    environment:
      CHANNELS: /data/channels.m3u
      YT_CHANNELS: /data/youtube.m3u
    volumes:
      - ./data:/data             # channels.m3u + youtube.m3u; writable so /admin can save
    mem_limit: 1g
    logging:
      options:
        max-size: "5m"
        max-file: "2"
